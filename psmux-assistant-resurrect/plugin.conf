# =============================================================================
# psmux-assistant-resurrect - resume AI assistant sessions across restarts
# Port of timvw/tmux-assistant-resurrect for psmux
# =============================================================================
# Requires: psmux-plugins/psmux-resurrect (with @resurrect-hook-* support)
# Optional: psmux-plugins/psmux-continuum for periodic auto-save
#
# Options:
#   set -g @assistant-resurrect-capture-env 'VAR1 VAR2'   # env vars to persist
#
# The entry script wires this plugin into psmux-resurrect's post-save and
# post-restore hooks and installs Claude Code SessionStart/SessionEnd hooks
# (idempotent). `powershell` is used rather than `pwsh` because Windows
# PowerShell 5.1 is always present; the scripts are 5.1-compatible.

run-shell 'powershell -NoProfile -ExecutionPolicy Bypass -File "~/.psmux/plugins/psmux-assistant-resurrect/psmux-assistant-resurrect.ps1"'
